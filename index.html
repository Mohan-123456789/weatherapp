<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Weather App</title>

<style>
body {
    background-color: #f0f0f0;
    font-family: Arial, sans-serif;
    margin: 0;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
}

/* Container */
.container {
    display: flex;
    flex-direction: column;
    align-items: center;
}

/* Form */
.weather-app {
    background-color: #fff;
    padding: 20px;
    border-radius: 10px;
    box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
    text-align: center;
    margin: 20px;
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 10px;
}

/* Input */
.city-input {
    padding: 10px;
    width: 100%;
    max-width: 250px;
    border: 1px solid #ccc;
    border-radius: 5px;
}

.city-input:focus {
    outline: none;
    border-color: #007BFF;
    box-shadow: 0 0 5px rgba(0, 123, 255, 0.5);
}

/* Buttons */
button {
    padding: 10px 20px;
    background-color: #007BFF;
    color: #fff;
    border: none;
    border-radius: 5px;
    cursor: pointer;
    margin: 5px;
    transition: background-color 0.3s ease;
}

button:hover {
    background-color: #0056b3;
}

/* Card */
.card {
    background-color: #ffffff;
    padding: 20px;
    border-radius: 10px;
    box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
    margin-top: 20px;
    text-align: center;
    border: 1px solid #eee;
}

/* Text */
h2 {
    margin: 0;
}

p {
    margin: 5px 0;
}

.temperature {
    font-size: 2em;
    font-weight: bold;
}

.description {
    font-size: 1.2em;
    color: #555;
}

.humidity {
    font-size: 1em;
    color: #777;
}

.error-message {
    color: red;
    font-weight: bold;
    margin-top: 10px;
}
</style>

</head>
<body>

<div class="container">

<form class="weather-app">
   <input type="text" class="city-input" placeholder="Enter city name" required>
   
   <button type="submit">Get Weather</button>
   <button type="reset">Reset</button>
   <button type="button">Refresh</button>
</form>

<div class="card">
    <h2 class="city-name">City Name</h2>
    <p class="temperature">Temperature: --°C</p>
    <p class="description">Description: --</p>
    <p class="humidity">Humidity: --%</p>
    <p class="error-message"></p>

    <script src="index.js"></script>
</div>

</div>

</body>
</html>

// weather app using openweathermap api
